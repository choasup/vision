<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>合成大西瓜 · Watermelon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #2b1d0e; user-select: none;
    background: linear-gradient(160deg, #fde8c4 0%, #f6c79a 60%, #e8a06a 100%);
  }
  #app {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    padding: 8px;
  }
  .stage {
    position: relative;
    background: linear-gradient(180deg, #fff7e3 0%, #ffe7b8 100%);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(120, 60, 0, .35), inset 0 0 0 4px #fff, inset 0 0 0 6px #cd853f;
    padding: 14px;
  }
  canvas {
    display: block; touch-action: none; cursor: grab;
    border-radius: 12px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.6), transparent 60%),
      linear-gradient(180deg, #ffeec2 0%, #ffd590 100%);
    box-shadow: inset 0 0 0 3px #b66a2f;
  }
  canvas:active { cursor: grabbing; }
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 6px 10px; gap: 10px;
  }
  .scoreBox {
    background: #fff; border: 3px solid #8b4513; border-radius: 12px;
    padding: 6px 14px; box-shadow: 0 3px 0 #8b4513;
    min-width: 110px;
  }
  .scoreBox .k { font-size: 11px; font-weight: 800; color: #8b4513; letter-spacing: 1px; }
  .scoreBox .v { font-size: 22px; font-weight: 900; color: #2b1d0e; line-height: 1.1; }
  .nextBox {
    display: flex; align-items: center; gap: 8px;
    background: #fff; border: 3px solid #8b4513; border-radius: 12px;
    padding: 4px 12px 4px 8px; box-shadow: 0 3px 0 #8b4513;
  }
  .nextBox .label { font-size: 11px; font-weight: 800; color: #8b4513; letter-spacing: 1px; }
  #nextCvs { width: 48px; height: 48px; display: block; }
  .evo {
    margin-top: 10px; display: flex; align-items: center; justify-content: center;
    gap: 4px; flex-wrap: wrap; padding: 6px 10px; background: rgba(255,255,255,.6);
    border-radius: 10px; border: 2px dashed #b66a2f;
  }
  .evo .item { font-size: 18px; opacity: .85; transition: transform .2s; }
  .evo .item.unlocked { opacity: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.2)); transform: scale(1.1); }
  .evo .arrow { color: #8b4513; font-weight: 900; font-size: 12px; }
  .overlay {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    border-radius: 20px; transition: opacity .25s; pointer-events: auto;
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .panel {
    background: linear-gradient(180deg, #fffdf4, #ffe9c0);
    border: 4px solid #8b4513; border-radius: 18px; padding: 24px 28px;
    text-align: center; min-width: 260px; box-shadow: 0 12px 0 #8b4513, 0 24px 60px rgba(0,0,0,.3);
  }
  .panel h1 { font-size: 26px; margin-bottom: 6px; color: #8b4513; letter-spacing: 2px; }
  .panel .sub { font-size: 13px; color: #5b3a14; margin-bottom: 14px; }
  .panel .stats { display: flex; gap: 10px; justify-content: center; margin-bottom: 16px; }
  .panel .stat {
    background: #fff; border: 3px solid #8b4513; border-radius: 10px;
    padding: 8px 14px; min-width: 96px;
  }
  .panel .stat .k { font-size: 10px; font-weight: 800; color: #8b4513; letter-spacing: 1px; }
  .panel .stat .v { font-size: 22px; font-weight: 900; }
  .btn {
    display: inline-block; cursor: pointer; padding: 10px 28px;
    background: #ff6b35; color: #fff; border: 3px solid #8b4513; border-radius: 12px;
    font-size: 16px; font-weight: 800; letter-spacing: 2px;
    box-shadow: 0 4px 0 #8b4513; transition: transform .08s, box-shadow .08s;
  }
  .btn:hover { background: #ff8a5b; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8b4513; }
  .new { color: #d81b60; font-weight: 800; font-size: 14px; margin-bottom: 8px; }
  .footer {
    position: absolute; bottom: 6px; left: 0; right: 0; text-align: center;
    font-size: 11px; color: #8b4513; opacity: .6; letter-spacing: 1px;
  }
  .combo {
    position: absolute; pointer-events: none; font-weight: 900; font-size: 22px;
    color: #ff3d00; text-shadow: 0 2px 0 #fff, 0 0 8px rgba(255, 100, 0, .7);
  }
  @media (max-height: 720px) {
    .panel { padding: 18px 22px; }
    .panel h1 { font-size: 22px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="stage" id="stage">
    <div class="top">
      <div class="scoreBox">
        <div class="k">SCORE</div>
        <div class="v" id="score">0</div>
      </div>
      <div class="scoreBox">
        <div class="k">BEST</div>
        <div class="v" id="best">0</div>
      </div>
      <div class="nextBox">
        <span class="label">NEXT</span>
        <canvas id="nextCvs" width="48" height="48"></canvas>
      </div>
    </div>
    <canvas id="game" width="380" height="540"></canvas>
    <div class="evo" id="evo"></div>
    <div class="overlay" id="startOverlay">
      <div class="panel">
        <h1>合成大西瓜</h1>
        <div class="sub">同种水果相撞 → 合成下一阶 → 凑出大西瓜！</div>
        <div class="sub" style="margin-bottom: 18px">左右移动选位置，点击 / 空格丢下</div>
        <div class="btn" id="startBtn">开始</div>
      </div>
    </div>
    <div class="overlay hidden" id="overOverlay">
      <div class="panel">
        <h1 id="overTitle">游戏结束</h1>
        <div class="new" id="newBest" style="display:none">🎉 新纪录！</div>
        <div class="stats">
          <div class="stat"><div class="k">SCORE</div><div class="v" id="finalScore">0</div></div>
          <div class="stat"><div class="k">BEST</div><div class="v" id="finalBest">0</div></div>
        </div>
        <div class="btn" id="retryBtn">再来一把</div>
      </div>
    </div>
  </div>
</div>
<div class="footer">单文件 HTML5 · 物理合成休闲游戏</div>

<script>
(() => {
  const cvs = document.getElementById('game');
  const ctx = cvs.getContext('2d');
  const nextCvs = document.getElementById('nextCvs');
  const nctx = nextCvs.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const evoEl = document.getElementById('evo');
  const startOverlay = document.getElementById('startOverlay');
  const overOverlay = document.getElementById('overOverlay');
  const startBtn = document.getElementById('startBtn');
  const retryBtn = document.getElementById('retryBtn');
  const finalScore = document.getElementById('finalScore');
  const finalBest = document.getElementById('finalBest');
  const newBestEl = document.getElementById('newBest');
  const overTitle = document.getElementById('overTitle');
  const stage = document.getElementById('stage');

  const W = cvs.width, H = cvs.height;
  const WALL_L = 6, WALL_R = W - 6, WALL_B = H - 6;
  const DROP_Y = 56;
  const DANGER_Y = 96;

  // 11 fruit tiers
  const FRUITS = [
    { r: 14,  color: '#ff5c5c', emoji: '🍒', name: '樱桃',     score: 1 },
    { r: 19,  color: '#ff8a8a', emoji: '🍓', name: '草莓',     score: 3 },
    { r: 26,  color: '#b066d8', emoji: '🍇', name: '葡萄',     score: 6 },
    { r: 33,  color: '#ff9a3c', emoji: '🍊', name: '橘子',     score: 10 },
    { r: 41,  color: '#ffd23f', emoji: '🍋', name: '柠檬',     score: 15 },
    { r: 50,  color: '#ff6b6b', emoji: '🍎', name: '苹果',     score: 21 },
    { r: 60,  color: '#c9e26a', emoji: '🍐', name: '梨',       score: 28 },
    { r: 72,  color: '#ffb199', emoji: '🍑', name: '桃子',     score: 36 },
    { r: 86,  color: '#ffce5c', emoji: '🍍', name: '菠萝',     score: 45 },
    { r: 102, color: '#bce26a', emoji: '🍈', name: '甜瓜',     score: 55 },
    { r: 120, color: '#5dba5d', emoji: '🍉', name: '大西瓜',   score: 100 },
  ];

  const STATE = { READY: 0, PLAY: 1, OVER: 2 };
  let state = STATE.READY;
  let balls = [];
  let particles = [];
  let combos = [];
  let nextId = 1;
  let score = 0;
  let best = +(localStorage.getItem('suika_best') || 0);
  let dropX = W / 2;
  let cooldown = 0;     // frames after dropping before next fruit appears
  let curLevel = 0;     // level of current dropping fruit (preview)
  let nextLevel = 0;    // next fruit
  let dangerTimer = 0;
  let unlocked = new Array(FRUITS.length).fill(false);
  let comboCount = 0;
  let comboTimer = 0;
  let won = false;

  bestEl.textContent = best;

  function rndStartLevel() {
    // Only first 5 tiers can drop
    const r = Math.random();
    if (r < 0.30) return 0;
    if (r < 0.55) return 1;
    if (r < 0.78) return 2;
    if (r < 0.93) return 3;
    return 4;
  }

  function reset() {
    balls = []; particles = []; combos = [];
    nextId = 1; score = 0; cooldown = 0; dangerTimer = 0;
    comboCount = 0; comboTimer = 0; won = false;
    unlocked = new Array(FRUITS.length).fill(false);
    curLevel = rndStartLevel();
    nextLevel = rndStartLevel();
    dropX = W / 2;
    scoreEl.textContent = '0';
    renderEvo();
    renderNext();
  }

  function start() {
    reset();
    state = STATE.PLAY;
    startOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
  }

  function renderEvo() {
    evoEl.innerHTML = '';
    for (let i = 0; i < FRUITS.length; i++) {
      const span = document.createElement('span');
      span.className = 'item' + (unlocked[i] ? ' unlocked' : '');
      span.textContent = FRUITS[i].emoji;
      evoEl.appendChild(span);
      if (i < FRUITS.length - 1) {
        const a = document.createElement('span');
        a.className = 'arrow';
        a.textContent = '›';
        evoEl.appendChild(a);
      }
    }
  }

  function renderNext() {
    nctx.clearRect(0, 0, 48, 48);
    drawFruitOn(nctx, 24, 24, FRUITS[nextLevel], 16);
  }

  function drawFruitOn(c, x, y, fruit, radius) {
    c.save();
    // shadow
    c.fillStyle = 'rgba(80,40,0,0.18)';
    c.beginPath();
    c.ellipse(x, y + radius * 0.85, radius * 0.85, radius * 0.25, 0, 0, Math.PI * 2);
    c.fill();
    // body
    const grd = c.createRadialGradient(x - radius * 0.35, y - radius * 0.35, radius * 0.1, x, y, radius);
    grd.addColorStop(0, lighten(fruit.color, 0.45));
    grd.addColorStop(0.55, fruit.color);
    grd.addColorStop(1, darken(fruit.color, 0.25));
    c.fillStyle = grd;
    c.beginPath();
    c.arc(x, y, radius, 0, Math.PI * 2);
    c.fill();
    // outline
    c.strokeStyle = darken(fruit.color, 0.45);
    c.lineWidth = Math.max(1.5, radius * 0.06);
    c.stroke();
    // emoji
    c.font = `${radius * 1.4}px serif`;
    c.textAlign = 'center';
    c.textBaseline = 'middle';
    c.fillText(fruit.emoji, x, y + radius * 0.06);
    // gloss
    c.fillStyle = 'rgba(255,255,255,0.35)';
    c.beginPath();
    c.ellipse(x - radius * 0.35, y - radius * 0.45, radius * 0.32, radius * 0.18, -0.5, 0, Math.PI * 2);
    c.fill();
    c.restore();
  }

  function lighten(hex, amt) { return mix(hex, '#ffffff', amt); }
  function darken(hex, amt)  { return mix(hex, '#000000', amt); }
  function mix(a, b, t) {
    const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
    const ar = (ah >> 16) & 255, ag = (ah >> 8) & 255, ab = ah & 255;
    const br = (bh >> 16) & 255, bg = (bh >> 8) & 255, bb = bh & 255;
    const r = Math.round(ar + (br - ar) * t);
    const g = Math.round(ag + (bg - ag) * t);
    const b2 = Math.round(ab + (bb - ab) * t);
    return '#' + [r, g, b2].map(v => v.toString(16).padStart(2, '0')).join('');
  }

  function spawnBall(x, y, level) {
    return {
      id: nextId++, x, y, vx: 0, vy: 0,
      level, r: FRUITS[level].r, mass: FRUITS[level].r * FRUITS[level].r,
      angle: 0, omega: 0, age: 0, justMerged: 0,
    };
  }

  function dropFruit() {
    if (cooldown > 0 || state !== STATE.PLAY) return;
    const fruit = FRUITS[curLevel];
    const x = Math.max(WALL_L + fruit.r, Math.min(WALL_R - fruit.r, dropX));
    const b = spawnBall(x, DROP_Y + fruit.r, curLevel);
    b.vy = 0;
    balls.push(b);
    curLevel = nextLevel;
    nextLevel = rndStartLevel();
    cooldown = 28;
    renderNext();
  }

  function step() {
    const G = 0.55;
    const FRICTION = 0.998;
    // integrate
    for (const b of balls) {
      b.vy += G;
      b.vx *= FRICTION;
      b.vy *= FRICTION;
      b.x += b.vx;
      b.y += b.vy;
      b.angle += b.omega;
      b.omega *= 0.95;
      b.age++;
      if (b.justMerged > 0) b.justMerged--;
    }

    // collisions: a few iterations for stability
    for (let it = 0; it < 5; it++) {
      // walls
      for (const b of balls) {
        if (b.x - b.r < WALL_L) {
          b.x = WALL_L + b.r;
          if (b.vx < 0) b.vx = -b.vx * 0.35;
        }
        if (b.x + b.r > WALL_R) {
          b.x = WALL_R - b.r;
          if (b.vx > 0) b.vx = -b.vx * 0.35;
        }
        if (b.y + b.r > WALL_B) {
          b.y = WALL_B - b.r;
          if (b.vy > 0) b.vy = -b.vy * 0.25;
          b.vx *= 0.85;
          b.omega *= 0.7;
        }
      }
      // ball-ball
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          resolve(balls[i], balls[j]);
        }
      }
    }

    // merges
    const merged = new Set();
    const toAdd = [];
    for (let i = 0; i < balls.length; i++) {
      const a = balls[i];
      if (merged.has(a.id)) continue;
      for (let j = i + 1; j < balls.length; j++) {
        const b = balls[j];
        if (merged.has(b.id)) continue;
        if (a.level !== b.level) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy;
        const minD = a.r + b.r;
        // a tiny tolerance so resting fruits merge
        if (d2 <= (minD + 0.6) * (minD + 0.6)) {
          merged.add(a.id);
          merged.add(b.id);
          if (a.level < FRUITS.length - 1) {
            const nl = a.level + 1;
            const nx = (a.x + b.x) / 2;
            const ny = (a.y + b.y) / 2;
            const nb = spawnBall(nx, ny, nl);
            nb.vx = (a.vx + b.vx) * 0.4;
            nb.vy = (a.vy + b.vy) * 0.4 - 1.5;
            nb.justMerged = 12;
            toAdd.push(nb);
            unlocked[nl] = true;
            burst(nx, ny, FRUITS[nl].color, FRUITS[nl].r);
            comboCount++;
            comboTimer = 60;
            const gain = FRUITS[nl].score * (1 + (comboCount > 1 ? (comboCount - 1) * 0.3 : 0)) | 0;
            score += gain;
            if (comboCount >= 2) showCombo(nx, ny - 30, 'COMBO ×' + comboCount);
            if (nl === FRUITS.length - 1) {
              // big watermelon achieved!
              showCombo(nx, ny - 50, '🍉 大西瓜!');
              for (let k = 0; k < 40; k++) burstParticle(nx, ny, FRUITS[nl].color);
              score += 500;
              if (!won) won = true;
            }
          } else {
            // two watermelons -> remove both, big bonus
            score += 1000;
            for (let k = 0; k < 60; k++) burstParticle((a.x+b.x)/2, (a.y+b.y)/2, '#5dba5d');
            showCombo((a.x+b.x)/2, (a.y+b.y)/2, '+1000!');
          }
          break;
        }
      }
    }
    if (merged.size > 0) {
      balls = balls.filter(b => !merged.has(b.id));
      for (const b of toAdd) balls.push(b);
      scoreEl.textContent = score;
      renderEvo();
    }
    if (comboTimer > 0) comboTimer--;
    else comboCount = 0;

    // particles
    for (const p of particles) {
      p.age++;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.15;
      p.vx *= 0.98;
    }
    particles = particles.filter(p => p.age < p.life);

    // combos float
    for (const c of combos) {
      c.age++;
      c.y -= 0.6;
    }
    combos = combos.filter(c => c.age < c.life);

    // game over: any fruit (not just dropped) above danger line for too long
    let danger = false;
    for (const b of balls) {
      if (b.age > 30 && b.y - b.r < DANGER_Y && Math.abs(b.vy) < 1.2) {
        danger = true;
        break;
      }
    }
    if (danger) {
      dangerTimer++;
      if (dangerTimer > 90) gameOver();
    } else {
      dangerTimer = Math.max(0, dangerTimer - 2);
    }

    if (cooldown > 0) cooldown--;
  }

  function resolve(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    let d2 = dx * dx + dy * dy;
    const minD = a.r + b.r;
    if (d2 >= minD * minD) return;
    let d = Math.sqrt(d2);
    if (d < 0.0001) { d = 0.01; }
    const nx = dx / d, ny = dy / d;
    const overlap = minD - d;
    const totalMass = a.mass + b.mass;
    const ka = b.mass / totalMass;
    const kb = a.mass / totalMass;
    a.x -= nx * overlap * ka;
    a.y -= ny * overlap * ka;
    b.x += nx * overlap * kb;
    b.y += ny * overlap * kb;
    // velocity along normal
    const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      const e = 0.15;
      const j = -(1 + e) * vn / (1 / a.mass + 1 / b.mass);
      const ix = j * nx, iy = j * ny;
      a.vx -= ix / a.mass;
      a.vy -= iy / a.mass;
      b.vx += ix / b.mass;
      b.vy += iy / b.mass;
      // friction induced spin
      const tx = -ny, ty = nx;
      const rvt = rvx * tx + rvy * ty;
      a.omega -= rvt * 0.002;
      b.omega += rvt * 0.002;
    }
  }

  function burst(x, y, color, r) {
    const n = 14 + (r / 6) | 0;
    for (let i = 0; i < n; i++) burstParticle(x, y, color);
  }

  function burstParticle(x, y, color) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1 + Math.random() * 4;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1,
      life: 30 + Math.random() * 20, age: 0, color,
      size: 2 + Math.random() * 3,
    });
  }

  function showCombo(x, y, text) {
    combos.push({ x, y, text, age: 0, life: 50 });
  }

  function gameOver() {
    if (state !== STATE.PLAY) return;
    state = STATE.OVER;
    let isNew = false;
    if (score > best) { best = score; localStorage.setItem('suika_best', best); isNew = true; }
    bestEl.textContent = best;
    setTimeout(() => {
      finalScore.textContent = score;
      finalBest.textContent = best;
      newBestEl.style.display = isNew ? '' : 'none';
      overTitle.textContent = won ? '🍉 制霸全场！' : '游戏结束';
      overOverlay.classList.remove('hidden');
    }, 600);
  }

  function render() {
    ctx.clearRect(0, 0, W, H);

    // walls (left/right/bottom interior)
    ctx.save();
    ctx.fillStyle = 'rgba(139,69,19,.12)';
    ctx.fillRect(0, 0, WALL_L, H);
    ctx.fillRect(WALL_R, 0, W - WALL_R, H);
    ctx.fillRect(0, WALL_B, W, H - WALL_B);
    ctx.restore();

    // danger line
    const dt = Math.min(1, dangerTimer / 90);
    ctx.save();
    ctx.strokeStyle = `rgba(255, ${80 - dt * 80 | 0}, ${80 - dt * 80 | 0}, ${0.5 + dt * 0.4})`;
    ctx.setLineDash([8, 6]);
    ctx.lineWidth = 2 + dt * 1.5;
    ctx.beginPath();
    ctx.moveTo(WALL_L, DANGER_Y);
    ctx.lineTo(WALL_R, DANGER_Y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // fruits
    for (const b of balls) {
      ctx.save();
      ctx.translate(b.x, b.y);
      const scale = b.justMerged > 0 ? 1 + Math.sin((12 - b.justMerged) / 12 * Math.PI) * 0.18 : 1;
      ctx.scale(scale, scale);
      ctx.rotate(b.angle);
      drawFruitOn(ctx, 0, 0, FRUITS[b.level], b.r);
      ctx.restore();
    }

    // particles
    for (const p of particles) {
      const a = 1 - p.age / p.life;
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // combo text
    for (const c of combos) {
      const a = 1 - c.age / c.life;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = '900 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#fff';
      ctx.strokeText(c.text, c.x, c.y);
      ctx.fillStyle = '#ff3d00';
      ctx.fillText(c.text, c.x, c.y);
      ctx.restore();
    }

    // current dropping fruit preview
    if (state === STATE.PLAY && cooldown === 0) {
      const fruit = FRUITS[curLevel];
      const x = Math.max(WALL_L + fruit.r, Math.min(WALL_R - fruit.r, dropX));
      // dotted guide
      ctx.save();
      ctx.strokeStyle = 'rgba(139,69,19,.4)';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x, DROP_Y + fruit.r);
      ctx.lineTo(x, WALL_B);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
      ctx.globalAlpha = 0.95;
      drawFruitOn(ctx, x, DROP_Y + fruit.r * 0.5, fruit, fruit.r);
      ctx.globalAlpha = 1;
    }
  }

  function loop() {
    if (state === STATE.PLAY) step();
    render();
    requestAnimationFrame(loop);
  }

  // Input
  function getX(evt) {
    const rect = cvs.getBoundingClientRect();
    const sx = (evt.touches ? evt.touches[0].clientX : evt.clientX) - rect.left;
    return sx / rect.width * W;
  }
  let pointerDown = false;
  cvs.addEventListener('mousemove', (e) => { dropX = getX(e); });
  cvs.addEventListener('mousedown', (e) => {
    pointerDown = true;
    dropX = getX(e);
  });
  cvs.addEventListener('mouseup', (e) => {
    if (pointerDown) { dropX = getX(e); dropFruit(); }
    pointerDown = false;
  });
  cvs.addEventListener('touchstart', (e) => {
    e.preventDefault();
    pointerDown = true;
    dropX = getX(e);
  }, { passive: false });
  cvs.addEventListener('touchmove', (e) => {
    e.preventDefault();
    dropX = getX(e);
  }, { passive: false });
  cvs.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (pointerDown) dropFruit();
    pointerDown = false;
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      dropX = Math.max(WALL_L + 5, dropX - 18);
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      dropX = Math.min(WALL_R - 5, dropX + 18);
    } else if (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'KeyS' || e.code === 'Enter') {
      e.preventDefault();
      if (state === STATE.OVER) start();
      else if (state === STATE.READY) start();
      else dropFruit();
    }
  });

  startBtn.addEventListener('click', start);
  retryBtn.addEventListener('click', start);

  // fit
  function fit() {
    const padW = window.innerWidth - 16;
    const padH = window.innerHeight - 16;
    // Ideal stage size includes 14px padding + top + evo. Compute scale.
    const stageW = W + 28;          // canvas + horizontal padding
    const stageH = H + 28 + 60 + 50; // canvas + padding + top + evo
    const s = Math.min(padW / stageW, padH / stageH, 1);
    stage.style.transform = `scale(${s})`;
    stage.style.transformOrigin = 'center center';
  }
  window.addEventListener('resize', fit);
  fit();

  reset();
  loop();
})();
</script>
</body>
</html>
